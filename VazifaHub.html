  <style>
    body {
      background-color: #070b16;
      color: #f3f4f6;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      transition: background 0.3s ease;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
    .glass-card {
      background: rgba(16, 24, 43, 0.9);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(38, 50, 74, 0.6);
    }
    .glass-nav {
      background: rgba(7, 11, 22, 0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(38, 50, 74, 0.8);
    }
    .glass-input {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid #26324a;
      transition: all 0.2s ease-in-out;
    }
    .glass-input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.35);
      outline: none;
    }
    
    /* Rainbow Animated Border Effect */
    @keyframes borderRotate {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }
    .rainbow-border {
      position: relative;
      border-radius: 1rem;
      padding: 2px;
      background: linear-gradient(135deg,#6366f1,#06b6d4,#ec4899,#8b5cf6);
      background-size: 250% 250%;
      animation: borderFlow 7s linear infinite;
      overflow: hidden;
      isolation: isolate;
    }
    .rainbow-inner {
      background: #10182b;
      border-radius: .88rem;
      position: relative;
      z-index: 1;
      min-width: 0;
    }
    /* Site frame: always visible, never changes on hover. */
    .site-frame-1 .rainbow-border{background:linear-gradient(135deg,#22d3ee,#6366f1,#ec4899)}
    .site-frame-2 .rainbow-border{background:linear-gradient(135deg,#ec4899,#f9a8d4,#a855f7)}
    .site-frame-3 .rainbow-border{background:linear-gradient(135deg,#14b8a6,#06b6d4,#60a5fa)}
    .site-frame-4 .rainbow-border{background:linear-gradient(135deg,#f59e0b,#ef4444,#facc15)}
    .site-frame-5 .rainbow-border{background:conic-gradient(#6366f1,#ec4899,#f59e0b,#22c55e,#06b6d4,#6366f1)}
    .site-frame-6 .rainbow-border{background:linear-gradient(135deg,#f8fafc,#94a3b8,#64748b)}
    .site-frame-7 .rainbow-border{background:linear-gradient(135deg,#38bdf8,#2563eb,#1e40af,#22d3ee)}
    .site-frame-8 .rainbow-border{background:linear-gradient(135deg,#c084fc,#8b5cf6,#6d28d9,#ec4899)}
    .site-frame-9 .rainbow-border{background:linear-gradient(135deg,#a3e635,#22c55e,#84cc16,#bef264)}
    .site-frame-10 .rainbow-border{background:linear-gradient(135deg,#f43f5e,#fb7185,#f97316,#facc15)}
    .site-frame-1 .neon-header,.site-frame-1 .neon-sidebar{border-color:rgba(34,211,238,.45)!important}
    .site-frame-2 .neon-header,.site-frame-2 .neon-sidebar{border-color:rgba(236,72,153,.45)!important}
    .site-frame-3 .neon-header,.site-frame-3 .neon-sidebar{border-color:rgba(20,184,166,.45)!important}
    .site-frame-4 .neon-header,.site-frame-4 .neon-sidebar{border-color:rgba(245,158,11,.45)!important}
    .site-frame-5 .neon-header,.site-frame-5 .neon-sidebar{border-color:rgba(168,85,247,.5)!important}
    .site-frame-6 .neon-header,.site-frame-6 .neon-sidebar{border-color:rgba(226,232,240,.35)!important}
    .site-frame-7 .neon-header,.site-frame-7 .neon-sidebar{border-color:rgba(56,189,248,.45)!important}
    .site-frame-8 .neon-header,.site-frame-8 .neon-sidebar{border-color:rgba(192,132,252,.45)!important}
    .site-frame-9 .neon-header,.site-frame-9 .neon-sidebar{border-color:rgba(163,230,53,.4)!important}
    .site-frame-10 .neon-header,.site-frame-10 .neon-sidebar{border-color:rgba(244,63,94,.45)!important}
    .rainbow-border:hover{filter:none!important;transform:none!important;}

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #070b16; }
    ::-webkit-scrollbar-thumb { background: #6366f1; border-radius: 4px; }
    .fade-in { animation: fadeIn 0.25s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    #toast-container {
      position: fixed; top: 1rem; right: 1rem; z-index: 9999; display: flex; flex-direction: column; gap: 0.5rem;
    }
    /* ===== Premium UI / Profile effects ===== */
    @keyframes auroraMove {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    @keyframes floatSoft {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes spinSlow { to { transform: rotate(360deg); } }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 rgba(99,102,241,0); }
      50% { box-shadow: 0 0 28px rgba(99,102,241,.22); }
    }
    .app-fullscreen { min-height: 100vh; width: 100%; }
    .site-shell { min-height: 100vh; width: 100%; }
    .site-content { min-width: 0; flex: 1 1 auto; }
    .profile-button.site-profile {
      min-width: 220px;
      border: 1px solid rgba(99,102,241,.35);
      box-shadow: 0 0 0 1px rgba(6,182,212,.08), 0 10px 35px rgba(0,0,0,.22);
    }
    .profile-button.site-profile:hover {
      border-color: rgba(34,211,238,.7);
      box-shadow: 0 0 22px rgba(34,211,238,.18), 0 10px 35px rgba(0,0,0,.28);
    }
    .profile-button.site-profile .profile-edit-hint {
      opacity: .65;
      transition: opacity .2s ease, transform .2s ease;
    }
    .profile-button.site-profile:hover .profile-edit-hint { opacity: 1; transform: translateX(2px); }
    .profile-modal-wide { width: min(1180px, 96vw); max-height: 92vh; overflow-y: auto; }
    .profile-hero {
      background: linear-gradient(135deg, rgba(15,23,42,.96), rgba(30,41,59,.9));
      border: 1px solid rgba(148,163,184,.18);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 20px 70px rgba(0,0,0,.3);
    }
    .frame-preview { min-height: 88px; }
    .frame-preview .frame-icon {
      width: 46px; height: 46px; border-radius: 14px; display:flex; align-items:center; justify-content:center;
      background: linear-gradient(145deg,#0f172a,#1e293b); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
    }
    .frame-preview.selected .frame-icon { box-shadow: 0 0 0 2px rgba(255,255,255,.85), 0 0 25px rgba(99,102,241,.45); }
    .avatar-frame.frame-1::before { background: conic-gradient(from 0deg,#6366f1,#06b6d4,#8b5cf6,#6366f1); animation-duration: 3.5s; }
    .avatar-frame.frame-2::before { background: conic-gradient(from 0deg,#22d3ee,#34d399,#a7f3d0,#22d3ee); animation-duration: 4s; }
    .avatar-frame.frame-3::before { background: conic-gradient(from 0deg,#38bdf8,#0ea5e9,#1d4ed8,#38bdf8); animation-duration: 4.5s; }
    .avatar-frame.frame-4::before { background: conic-gradient(from 0deg,#fb7185,#f97316,#facc15,#fb7185); animation-duration: 3.2s; }
    .avatar-frame.frame-5::before { background: conic-gradient(from 0deg,#ef4444,#f59e0b,#22c55e,#06b6d4,#8b5cf6,#ec4899,#ef4444); animation-duration: 2.8s; }
    .avatar-frame.frame-6::before { background: conic-gradient(from 0deg,#f8fafc,#94a3b8,#e2e8f0,#64748b,#f8fafc); animation-duration: 5s; }
    .avatar-frame.frame-7::before { background: conic-gradient(from 0deg,#60a5fa,#2563eb,#1e40af,#22d3ee,#60a5fa); animation-duration: 3.8s; }
    .avatar-frame.frame-8::before { background: conic-gradient(from 0deg,#c084fc,#8b5cf6,#6d28d9,#ec4899,#c084fc); animation-duration: 3.6s; }
    .avatar-frame.frame-9::before { background: conic-gradient(from 0deg,#a3e635,#22c55e,#84cc16,#bef264,#a3e635); animation-duration: 4.2s; }
    .avatar-frame.frame-10::before { background: conic-gradient(from 0deg,#f43f5e,#fb7185,#f97316,#facc15,#f43f5e); animation-duration: 2.6s; }

    /* 10 floral/decorative frame variants */
    .avatar-frame.frame-1::before{background:radial-gradient(circle at 50% 0,#67e8f9 0 14%,transparent 15%),conic-gradient(#06b6d4,#6366f1,#ec4899,#06b6d4)}
    .avatar-frame.frame-2::before{background:radial-gradient(circle at 0 50%,#f9a8d4 0 13%,transparent 14%),conic-gradient(#ec4899,#a855f7,#f9a8d4,#ec4899)}
    .avatar-frame.frame-3::before{background:radial-gradient(circle at 100% 50%,#5eead4 0 13%,transparent 14%),conic-gradient(#14b8a6,#06b6d4,#60a5fa,#14b8a6)}
    .avatar-frame.frame-4::before{background:radial-gradient(circle at 50% 100%,#fde68a 0 13%,transparent 14%),conic-gradient(#f59e0b,#ef4444,#facc15,#f59e0b)}
    .avatar-frame.frame-5::before{background:radial-gradient(circle at 50% 0,#f0abfc 0 12%,transparent 13%),radial-gradient(circle at 100% 50%,#86efac 0 12%,transparent 13%),conic-gradient(#6366f1,#ec4899,#f59e0b,#22c55e,#06b6d4,#6366f1)}
    .avatar-frame.frame-6::before{background:radial-gradient(circle at 0 50%,#fff 0 12%,transparent 13%),conic-gradient(#e2e8f0,#94a3b8,#f8fafc,#64748b,#e2e8f0)}
    .avatar-frame.frame-7::before{background:radial-gradient(circle at 50% 0,#93c5fd 0 13%,transparent 14%),conic-gradient(#38bdf8,#2563eb,#1e40af,#22d3ee,#38bdf8)}
    .avatar-frame.frame-8::before{background:radial-gradient(circle at 100% 50%,#d8b4fe 0 13%,transparent 14%),conic-gradient(#c084fc,#8b5cf6,#6d28d9,#ec4899,#c084fc)}
    .avatar-frame.frame-9::before{background:radial-gradient(circle at 50% 100%,#bef264 0 13%,transparent 14%),conic-gradient(#a3e635,#22c55e,#84cc16,#bef264,#a3e635)}
    .avatar-frame.frame-10::before{background:radial-gradient(circle at 0 50%,#fda4af 0 13%,transparent 14%),conic-gradient(#f43f5e,#fb7185,#f97316,#facc15,#f43f5e)}

    .avatar-frame.frame-5, .avatar-frame.frame-10 { filter: drop-shadow(0 0 10px rgba(236,72,153,.22)); }
    .premium-bg {
      background:
        radial-gradient(circle at 15% 20%, rgba(99,102,241,.14), transparent 28%),
        radial-gradient(circle at 85% 75%, rgba(6,182,212,.12), transparent 28%);
    }
    .premium-card {
      position: relative;
      overflow: hidden;
      box-shadow: 0 18px 60px rgba(0,0,0,.22);
    }
    .premium-card::before {
      content: "";
      position: absolute; inset: -2px;
      background: linear-gradient(120deg,#6366f1,#06b6d4,#ec4899,#8b5cf6,#10b981,#6366f1);
      background-size: 400% 400%;
      animation: auroraMove 7s ease infinite;
      opacity: .12;
      pointer-events: none;
    }
    .profile-button {
      position: relative;
      transition: transform .2s ease, filter .2s ease;
    }
    .profile-button:hover { transform: translateY(-1px); filter: brightness(1.08); }
    .avatar-frame {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      isolation: isolate;
    }
    .avatar-frame::before {
      content: "";
      position: absolute; inset: -5px;
      border-radius: inherit;
      background: conic-gradient(from 0deg,#6366f1,#06b6d4,#22c55e,#f59e0b,#ec4899,#8b5cf6,#6366f1);
      animation: spinSlow 5s linear infinite;
      z-index: -2;
    }
    .avatar-frame::after {
      content: "";
      position: absolute; inset: -1px;
      border-radius: inherit;
      background: #0b1120;
      z-index: -1;
    }
    .profile-avatar {
      width: 100%; height: 100%; object-fit: cover; border-radius: inherit;
      display: block; background: linear-gradient(135deg,#1e293b,#0f172a);
    }
    .frame-preview {
      position: relative; padding: 5px; border-radius: 18px; cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease;
      background: linear-gradient(135deg,#334155,#0f172a);
    }
    .frame-preview:hover { transform: translateY(-3px) scale(1.02); }
    .frame-preview.selected { box-shadow: 0 0 0 2px #fff, 0 0 0 4px #6366f1, 0 12px 30px rgba(99,102,241,.25); }
    .frame-preview > div { border-radius: 13px; }
    .frame-1 { background: linear-gradient(135deg,#6366f1,#06b6d4); }
    .frame-2 { background: linear-gradient(135deg,#ec4899,#8b5cf6); }
    .frame-3 { background: linear-gradient(135deg,#10b981,#06b6d4); }
    .frame-4 { background: linear-gradient(135deg,#f59e0b,#ef4444); }
    .frame-5 { background: conic-gradient(#6366f1,#ec4899,#f59e0b,#10b981,#6366f1); }
    .frame-6 { background: linear-gradient(135deg,#f8fafc,#94a3b8); }
    .frame-7 { background: linear-gradient(135deg,#0ea5e9,#1d4ed8); }
    .frame-8 { background: linear-gradient(135deg,#a855f7,#4f46e5); }
    .frame-9 { background: linear-gradient(135deg,#14b8a6,#84cc16); }
    .frame-10 { background: linear-gradient(135deg,#fb7185,#f97316,#facc15); }
    .sparkle {
      animation: floatSoft 2.8s ease-in-out infinite;
    }



    /* ===== NFT / SHOP COSMETIC SYSTEM ===== */
    @keyframes nftFloat {0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-4px) rotate(1deg)}}
    @keyframes nftShine {0%{transform:translateX(-130%) rotate(12deg)}100%{transform:translateX(420%) rotate(12deg)}}
    @keyframes nftPulse {0%,100%{opacity:.65;filter:blur(8px)}50%{opacity:1;filter:blur(14px)}}
    @keyframes nftOrbit {from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    @keyframes nftRainbow {0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(360deg)}}
    .nft-name{position:relative;display:inline-block;font-weight:1000;letter-spacing:-.02em;line-height:1.1;animation:nftFloat 3s ease-in-out infinite}
    .nft-name::after{content:"";position:absolute;left:-8%;right:-8%;bottom:-5px;height:2px;border-radius:99px;background:currentColor;opacity:.28;filter:blur(2px);animation:nftPulse 2s ease-in-out infinite}
    .nft-badge{display:inline-flex;align-items:center;gap:5px;margin-left:7px;padding:3px 8px;border-radius:999px;font-size:9px;font-weight:1000;vertical-align:middle;white-space:nowrap;border:1px solid rgba(255,255,255,.25);box-shadow:0 0 14px currentColor;background:rgba(2,6,23,.72);animation:nftFloat 2.6s ease-in-out infinite}
    .nft-tier{display:inline-flex;align-items:center;gap:4px;font-size:8px;font-weight:1000;padding:3px 7px;border-radius:999px;background:rgba(2,6,23,.72);border:1px solid currentColor;box-shadow:0 0 16px currentColor}
    .nft-name-gold{color:#ffd54a;text-shadow:0 0 5px #f59e0b,0 0 16px rgba(250,204,21,.8),0 0 35px rgba(245,158,11,.5)}
    .nft-name-silver{color:#e5e7eb;text-shadow:0 0 8px #fff,0 0 22px rgba(203,213,225,.7)}
    .nft-name-cyan{color:#67e8f9;text-shadow:0 0 8px #06b6d4,0 0 24px rgba(34,211,238,.7)}
    .nft-name-emerald{color:#6ee7b7;text-shadow:0 0 8px #10b981,0 0 24px rgba(16,185,129,.7)}
    .nft-name-royal{color:#c4b5fd;text-shadow:0 0 8px #8b5cf6,0 0 24px rgba(139,92,246,.8)}
    .nft-name-fire{color:#fb923c;text-shadow:0 0 8px #f97316,0 0 24px rgba(239,68,68,.85)}
    .nft-name-ice{color:#bae6fd;text-shadow:0 0 8px #38bdf8,0 0 25px rgba(125,211,252,.8)}
    .nft-name-galaxy{color:#e9d5ff;text-shadow:0 0 8px #c084fc,0 0 25px rgba(168,85,247,.85),0 0 45px rgba(236,72,153,.45)}
    .nft-name-cosmic{color:#f5d0fe;text-shadow:0 0 8px #e879f9,0 0 25px #a855f7,0 0 48px rgba(34,211,238,.65);animation:nftFloat 2.3s ease-in-out infinite,nftRainbow 7s linear infinite}
    .nft-name-void{color:#ddd6fe;text-shadow:0 0 7px #8b5cf6,0 0 22px #4c1d95,0 0 45px #111827}
    .nft-name-celestial{color:#fff7ed;text-shadow:0 0 8px #fbbf24,0 0 20px #60a5fa,0 0 42px rgba(250,204,21,.85)}
    .nft-name-god{color:#fef3c7;text-shadow:0 0 8px #facc15,0 0 20px #fb7185,0 0 42px #a855f7;animation:nftFloat 1.9s ease-in-out infinite}
    .nft-name-ultimate{color:#fff7ed;text-shadow:0 0 8px #fff,0 0 18px #facc15,0 0 34px #fb7185,0 0 60px #8b5cf6;animation:nftFloat 1.7s ease-in-out infinite,nftRainbow 5s linear infinite}
    .nft-product-card{position:relative;overflow:hidden;isolation:isolate;border-radius:24px!important;transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
    .nft-product-card:hover{transform:translateY(-5px) scale(1.008);box-shadow:0 24px 70px rgba(0,0,0,.45),0 0 35px var(--nft-glow,rgba(99,102,241,.2))!important}
    .nft-product-card::before{content:"";position:absolute;inset:-45%;background:radial-gradient(circle,var(--nft-glow,rgba(99,102,241,.16)),transparent 55%);filter:blur(15px);animation:nftPulse 3.2s ease-in-out infinite;z-index:-2}
    .nft-product-card::after{content:"";position:absolute;top:-40%;left:-15%;width:30%;height:180%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);transform:rotate(14deg);animation:nftShine 4.5s ease-in-out infinite;pointer-events:none;z-index:5}
    .nft-visual{height:180px;border-radius:20px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid rgba(255,255,255,.13);background:var(--nft-bg,#111827);box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
    .nft-visual::before{content:"";position:absolute;inset:-25%;background:conic-gradient(from 0deg,transparent,var(--nft-accent,#60a5fa),transparent 30%);opacity:.25;animation:nftOrbit 8s linear infinite}
    .nft-visual .nft-icon{position:relative;z-index:2;font-size:72px;filter:drop-shadow(0 0 18px var(--nft-glow,rgba(99,102,241,.7)));animation:nftFloat 2.8s ease-in-out infinite}
    .nft-visual .nft-spark{position:absolute;inset:0;background-image:radial-gradient(circle,var(--nft-accent,#60a5fa) 0 1px,transparent 1.5px);background-size:35px 35px;opacity:.28;animation:starDrift 8s ease-in-out infinite}
    .nft-profile-hero{position:relative;overflow:hidden;border:1px solid var(--nft-border,rgba(99,102,241,.35));background:linear-gradient(135deg,rgba(4,10,27,.98),rgba(23,18,48,.92));box-shadow:0 0 45px var(--nft-glow,rgba(99,102,241,.18)),inset 0 1px 0 rgba(255,255,255,.07)}
    .nft-profile-hero::before{content:"";position:absolute;inset:-30%;background:radial-gradient(circle,var(--nft-glow,rgba(99,102,241,.16)),transparent 50%);filter:blur(20px);animation:nftPulse 3s ease-in-out infinite;pointer-events:none}
    .nft-avatar-effect{position:relative;z-index:1;filter:drop-shadow(0 0 16px var(--nft-glow,rgba(99,102,241,.35)))}
    .nft-avatar-effect::before{content:"";position:absolute;inset:-10px;border-radius:inherit;border:2px solid var(--nft-accent,#60a5fa);box-shadow:0 0 18px var(--nft-glow,rgba(99,102,241,.55)),inset 0 0 18px var(--nft-glow,rgba(99,102,241,.18));animation:nftOrbit 7s linear infinite;pointer-events:none}
    .nft-avatar-effect::after{content:attr(data-nft-icon);position:absolute;right:-7px;bottom:-3px;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(2,6,23,.94);border:2px solid var(--nft-accent,#60a5fa);box-shadow:0 0 18px var(--nft-glow,rgba(99,102,241,.6));font-size:18px;animation:nftFloat 2s ease-in-out infinite;pointer-events:none}
    .nft-input{transition:box-shadow .2s ease,border-color .2s ease}
    .nft-input::selection{background:rgba(255,255,255,.25)}
    .nft-input.nft-name-gold,.nft-input.nft-name-silver,.nft-input.nft-name-cyan,.nft-input.nft-name-emerald,.nft-input.nft-name-royal,.nft-input.nft-name-fire,.nft-input.nft-name-ice,.nft-input.nft-name-galaxy,.nft-input.nft-name-cosmic,.nft-input.nft-name-void,.nft-input.nft-name-celestial,.nft-input.nft-name-god,.nft-input.nft-name-ultimate{font-weight:1000!important;background-color:#0b1222!important}

          db.chatMessages = db.chatMessages || [];
          db.products = Array.isArray(db.products) ? db.products : [];
          if (typeof window !== 'undefined' && typeof normalizeNftDatabase === 'function') normalizeNftDatabase(db);
          db.carts = db.carts && typeof db.carts === 'object' ? db.carts : {};
          db.purchases = Array.isArray(db.purchases) ? db.purchases : [];
          return db;
        } catch (e) {
          this.resetToDefaults();
          return JSON.parse(localStorage.getItem(this.STORAGE_KEY));
        }
      }

      save(data) {
        localStorage.setItem(this.STORAGE_KEY, JSON.stringify(data));
      }

      getUsers() { return this.getDB().users || []; }
      
      getUserByLogin(login) {
        return this.getUsers().find(u => u.login.toLowerCase() === login.trim().toLowerCase());
      }

      addUser(user) {
        const db = this.getDB();
        if (db.users.some(u => u.login.toLowerCase() === user.login.toLowerCase())) {
          throw new Error('Ushbu login band!');
        }
        db.users.push(user);
        this.save(db);
      }

      deleteUser(id) {
        const db = this.getDB();
        db.users = db.users.filter(u => u.id !== id);
        this.save(db);
      }

      getHomeworks() { return this.getDB().homeworks || []; }
      
      addHomework(hw) {
        const db = this.getDB();
        db.homeworks.unshift(hw);
        this.save(db);
      }

      getSubmissions() { return this.getDB().submissions || []; }
      
      submitHomework(sub) {
        const db = this.getDB();
        const index = db.submissions.findIndex(s => s.homeworkId === sub.homeworkId && s.studentId === sub.studentId);
        if (index !== -1) {
          db.submissions[index] = { ...db.submissions[index], ...sub };
        } else {
          db.submissions.push(sub);
        }
        this.save(db);
      }

      gradeSubmission(submissionId, grade, feedback) {
        const db = this.getDB();
        const sub = db.submissions.find(s => s.id === submissionId);
        if (sub) {
          sub.grade = grade;
          sub.feedback = feedback;
          sub.status = 'graded';
          this.save(db);
        }
      }

      getChatMessages() { return this.getDB().chatMessages || []; }
      
      addChatMessage(msg) {
        const db = this.getDB();
        db.chatMessages.push(msg);
        this.save(db);
      }

      getCustomBg() {
        return this.getDB().customBg || '';
      }

      setCustomBg(bg) {
        const db = this.getDB();
        db.customBg = bg;
        this.save(db);
      }
      updateUserProfile(id, patch) {
        const db = this.getDB();
        const user = db.users.find(u => u.id === id);
        if (!user) throw new Error("Foydalanuvchi topilmadi!");
        Object.assign(user, patch);
        this.save(db);
        return user;
      }

      getUserById(id) {
        return this.getUsers().find(u => u.id === id);
      }

      getProducts() { return this.getDB().products || []; }

      setActiveNft(userId, productId, enabled = true) {
        const db = this.getDB();
        const user = db.users.find(u => u.id === userId);
        if (!user) return null;
        user.activeProductId = productId || '';
        user.nftAvatarEnabled = !!enabled;
        this.save(db);
        return user;
      }

      addProduct(product) {
        const db = this.getDB();
        db.products.unshift(product);
        this.save(db);
      }

      deleteProduct(id) {
        const db = this.getDB();
        db.products = db.products.filter(p => p.id !== id);
        Object.keys(db.carts || {}).forEach(uid => {
          db.carts[uid] = (db.carts[uid] || []).filter(item => item.productId !== id);
        });
        this.save(db);
      }

      getCart(userId) {
        const db = this.getDB();
        return Array.isArray(db.carts?.[userId]) ? db.carts[userId] : [];
      }

      addToCart(userId, productId) {
        const db = this.getDB();
        db.carts[userId] = Array.isArray(db.carts[userId]) ? db.carts[userId] : [];
        const found = db.carts[userId].find(i => i.productId === productId);
        if (found) found.qty += 1;
        else db.carts[userId].push({ productId, qty: 1 });
        this.save(db);
      }

      removeFromCart(userId, productId) {
        const db = this.getDB();
        db.carts[userId] = (db.carts[userId] || []).filter(i => i.productId !== productId);
        this.save(db);
      }

      clearCart(userId) {
        const db = this.getDB();
        db.carts[userId] = [];
        this.save(db);
      }

      getPurchases() { return this.getDB().purchases || []; }

      addPurchase(purchase) {
        const db = this.getDB();
        db.purchases.unshift(purchase);
        this.save(db);
      }

      getStudentEarnedPoints(userId) {
        return this.getSubmissions()
          .filter(s => s.studentId === userId && s.status === 'graded')
          .reduce((sum, s) => sum + (Number(s.points ?? s.grade ?? 0) || 0), 0);
      }

      getStudentSpentPoints(userId) {
        return this.getPurchases()
          .filter(p => p.studentId === userId && p.status !== 'cancelled')
          .reduce((sum, p) => sum + (Number(p.total ?? p.price ?? 0) || 0), 0);
      }

      getStudentBalance(userId) {
        return Math.max(0, this.getStudentEarnedPoints(userId) - this.getStudentSpentPoints(userId));
      }

    }

    ];

    function nftForProduct(product) {
      if (!product) return null;
      const n = (product.name || '').toLowerCase();
      const direct = NFT_CATALOG.find(x => x.id === product.id);
      if (direct) return { ...direct, ...product, icon: product.icon || direct.icon, effect: product.effect || direct.effect, label: product.label || direct.label, bg: product.bg || direct.bg, accent: product.accent || direct.accent };
      if (n.includes('oltin') || n.includes('gold')) return { ...NFT_CATALOG[3], ...product, effect:'gold', icon:product.icon||'🏡', label:product.label||'OLTIN' };
      if (n.includes('kumush') || n.includes('silver')) return { ...NFT_CATALOG[2], ...product, effect:'silver', icon:product.icon||'📚', label:product.label||'KUMUSH' };
      if (n.includes('toj') || n.includes('crown')) return { ...NFT_CATALOG[5], ...product, effect:'royal', icon:product.icon||'👑', label:product.label||'QIROL' };
      if (n.includes('phoenix') || n.includes('olov') || n.includes('fire')) return { ...NFT_CATALOG[6], ...product, effect:'fire', icon:product.icon||'🔥', label:product.label||'PHOENIX' };
      if (Number(product.price) >= 10000) return { ...NFT_CATALOG[13], ...product, effect:'ultimate', icon:product.icon||'👑', label:product.label||'ULTIMATE' };
      if (Number(product.price) >= 9000) return { ...NFT_CATALOG[12], ...product, effect:'god', icon:product.icon||'☄️', label:product.label||'GOD' };
      if (Number(product.price) >= 8000) return { ...NFT_CATALOG[11], ...product, effect:'celestial', icon:product.icon||'⚜️', label:product.label||'CELESTIAL' };
      if (Number(product.price) >= 7000) return { ...NFT_CATALOG[10], ...product, effect:'void', icon:product.icon||'🌀', label:product.label||'VOID' };
      if (Number(product.price) >= 5000) return { ...NFT_CATALOG[9], ...product, effect:'cosmic', icon:product.icon||'🪐', label:product.label||'COSMIC' };
      if (Number(product.price) >= 2500) return { ...NFT_CATALOG[8], ...product, effect:'galaxy', icon:product.icon||'🌌', label:product.label||'GALAXY' };
      if (Number(product.price) >= 1200) return { ...NFT_CATALOG[7], ...product, effect:'ice', icon:product.icon||'💎', label:product.label||'DIAMOND' };
      if (Number(product.price) >= 700) return { ...NFT_CATALOG[6], ...product, effect:'fire', icon:product.icon||'🔥', label:product.label||'PHOENIX' };
      if (Number(product.price) >= 500) return { ...NFT_CATALOG[5], ...product, effect:'royal', icon:product.icon||'👑', label:product.label||'QIROL' };
      if (Number(product.price) >= 350) return { ...NFT_CATALOG[4], ...product, effect:'royal', icon:product.icon||'🛡️', label:product.label||'QALQON' };
      if (Number(product.price) >= 200) return { ...NFT_CATALOG[3], ...product, effect:'gold', icon:product.icon||'🏡', label:product.label||'OLTIN' };
      if (Number(product.price) >= 100) return { ...NFT_CATALOG[2], ...product, effect:'silver', icon:product.icon||'📚', label:product.label||'KUMUSH' };
      if (Number(product.price) >= 50) return { ...NFT_CATALOG[1], ...product, effect:'emerald', icon:product.icon||'🏠', label:product.label||'UY EGASI' };
      return { ...NFT_CATALOG[0], ...product, effect:'cyan', icon:product.icon||'🎒', label:product.label||'RYUKZAK' };
    }

    function normalizeNftDatabase(db) {
      const existing = new Set((db.products || []).map(p => p.id));
      NFT_CATALOG.forEach(item => {
        if (!existing.has(item.id)) db.products.push({ ...item, image: '' });
      });
      db.products = db.products.map((p, i) => {
        const meta = NFT_CATALOG.find(x => x.id === p.id) || nftForProduct(p) || NFT_CATALOG[i % NFT_CATALOG.length];
        return { ...p, ...meta, image: p.image || '' };
      });
      db.users = (db.users || []).map(u => ({ activeProductId:'', nftAvatarEnabled:false, ...u, nftAvatarEnabled:u.nftAvatarEnabled !== false }));
      (db.users || []).forEach(u => {
        if (!u.activeProductId && u.role === 'student') {
          const latest = (db.purchases || []).find(p => p.studentId === u.id && p.status === 'paid');
          if (latest && db.products.some(p => p.id === latest.productId)) { u.activeProductId = latest.productId; u.nftAvatarEnabled = true; }
        }
      });
    }

    function getActiveNft(user) {
      if (!user?.activeProductId) return null;
      const product = DB.getProducts().find(p => p.id === user.activeProductId);
      return product ? nftForProduct(product) : null;
    }

    function nftNameClass(nft) { return nft ? `nft-name-${nft.effect || 'cyan'}` : ''; }
    function nftCssVars(nft) { return nft ? `--nft-accent:${nft.accent || '#60a5fa'};--nft-glow:${nft.accent || '#60a5fa'}55;--nft-bg:${nft.bg || '#111827'};--nft-border:${nft.accent || '#60a5fa'}66;` : ''; }
    function nftTier(nft) {
      if (!nft) return '';
      const p = Number(nft.price || 0);
      return p >= 10000 ? 'ULTIMATE • 10 000' : p >= 9000 ? 'GOD • 9 000+' : p >= 8000 ? 'CELESTIAL • 8 000+' : p >= 7000 ? 'VOID • 7 000+' : p >= 5000 ? 'COSMIC • 5 000+' : p >= 2500 ? 'GALAXY • 2 500+' : p >= 1000 ? 'PREMIUM • 1 000+' : p >= 700 ? 'EPIC • 700+' : 'COLLECTION';
    }

    function profileNameMarkup(user, extraClass='') {

      return `<span class="nft-name ${nftNameClass(nft)} ${extraClass}" style="${nftCssVars(nft)}">${name}</span><span class="nft-badge" style="color:${nft.accent};--nft-accent:${nft.accent}" title="${escapeHtml(nft.name)}">${nft.icon} NFT</span>`;

    function renderRatingContent() {
      const container = document.createElement('div');
      container.className = 'space-y-4';
      const myClass = AppState.currentUser.className || CLASSES_LIST[0];
      const students = DB.getUsers().filter(u => u.role === 'student' && u.className === myClass);
      const gradedSubs = DB.getSubmissions().filter(s => s.status === 'graded' && s.className === myClass);

      const ratingList = students.map(st => {
        const score = gradedSubs.filter(s => s.studentId === st.id).reduce((acc, c) => acc + (parseFloat(c.grade) || 0), 0);
        return { ...st, score };
      }).sort((a, b) => b.score - a.score);

      container.innerHTML = `
        <h2 class="text-base font-bold text-white">${t('rating')} (${myClass} sinf)</h2>
        <div class="glass-card rounded-2xl overflow-hidden border border-brand-border safe-card">
          <table class="w-full text-left text-xs">

                <tr class="hover:bg-slate-800/40 transition">
                  <td class="p-3 font-bold ${idx === 0 ? 'text-amber-400' : 'text-slate-400'}">#${idx + 1}</td>
                  <td class="p-3 font-bold">${profileNameMarkup(st)}</td>

    }

    function renderChatContent() {
      const container = document.createElement('div');
      container.className = 'glass-card rounded-2xl border border-brand-border h-[75vh] flex flex-col overflow-hidden';
      const messages = DB.getChatMessages();

      container.innerHTML = `

          ${messages.map(m => `
            <div class="flex flex-col ${m.senderId === AppState.currentUser.id ? 'items-end' : 'items-start'}">

              <div class="px-3 py-2 rounded-xl text-xs max-w-xs ${m.senderId === AppState.currentUser.id ? 'bg-brand-600 text-white' : 'bg-slate-800 text-slate-200'}">

          `).join('')}
        </div>

          <input type="text" id="chat-input" placeholder="Xabar yozing..." required class="flex-1 glass-input px-3 py-2 rounded-xl text-xs text-white focus:outline-none">
          <button type="submit" class="px-4 py-2 bg-brand-600 hover:bg-brand-500 text-white rounded-xl text-xs font-bold transition">Yuborish</button>
        </form>
      `;

      setTimeout(() => {
        const box = container.querySelector('#chat-messages');
        if (box) box.scrollTop = box.scrollHeight;
        const form = container.querySelector('#chat-form');
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const txt = container.querySelector('#chat-input').value.trim();

          DB.addChatMessage({
            senderId: AppState.currentUser.id,
            senderName: AppState.currentUser.name,
            text: txt,
            time: new Date().toLocaleTimeString()
          });
          renderApp();
        });
      }, 0);

      return container;
    }

    function fileToDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

                  <div class="flex flex-col items-end gap-1"><span class="text-amber-300 font-black text-xs">${p.total} pt</span><button onclick="activateNft('${p.productId}')" class="px-2.5 py-1 rounded-lg text-[9px] font-black ${active?'bg-emerald-500/20 text-emerald-300':'bg-slate-800 text-slate-300'}">${active?'✓ Faol':'Profilga qo‘yish'}</button></div>
                </div>
              `; }).join('')}
            </div>
          </div>
        </div>
      `;
      return container;
    }

    window.addProductToCart = function(productId) {
      const product = DB.getProducts().find(p => p.id === productId);
      if (!product) return;
      DB.addToCart(AppState.currentUser.id, productId);
      showToast(`🛒 ${product.name} korzinkaga qo'shildi!`);
      renderApp();
    };

    window.removeCartItem = function(productId) {
      DB.removeFromCart(AppState.currentUser.id, productId);
      renderApp();
    };

    window.checkoutCart = function() {
      const userId = AppState.currentUser.id;
      const cart = DB.getCart(userId);
      const products = DB.getProducts();
      const detailed = cart.map(i => {
        const product = products.find(p => p.id === i.productId);
        return product ? { ...i, product, total: product.price * i.qty } : null;
      }).filter(Boolean);
      const total = detailed.reduce((sum, item) => sum + item.total, 0);
      const balance = DB.getStudentBalance(userId);
      if (!detailed.length) return;
      if (total > balance) {
        showToast("Ball yetarli emas!", "error");
        return;
      }

      let lastPurchasedId = '';
      detailed.forEach(item => {
        const nft = nftForProduct(item.product);
        DB.addPurchase({
          id: 'buy-' + Date.now() + '-' + Math.random().toString(36).slice(2,8),
          studentId: userId,
          productId: item.product.id,
          productName: item.product.name,
          price: item.product.price,
          qty: item.qty,
          total: item.total,
          status: 'paid',
          nftEffect: nft?.effect || '',
          nftIcon: nft?.icon || '✨',
          nftLabel: nft?.label || 'NFT',
          purchasedAt: new Date().toISOString()
        });
        lastPurchasedId = item.product.id;
      });
      DB.clearCart(userId);
      if (lastPurchasedId) DB.setActiveNft(userId, lastPurchasedId, true);
      AppState.currentUser = DB.getUserById(userId) || AppState.currentUser;
      sessionStorage.setItem('edutask_user', JSON.stringify(AppState.currentUser));
      showToast(`✅ Xarid qilindi! ${total} ball ishlatildi. NFT profilingizga darhol qo'yildi!`);
      renderApp();
    };


    window.activateNft = function(productId) {
      const userId = AppState.currentUser.id;
      const owned = DB.getPurchases().some(p => p.studentId === userId && p.productId === productId && p.status === 'paid');
      if (!owned) { showToast('Bu NFT sizda yo‘q!', 'error'); return; }
      DB.setActiveNft(userId, productId, true);
      AppState.currentUser = DB.getUserById(userId) || AppState.currentUser;
      sessionStorage.setItem('edutask_user', JSON.stringify(AppState.currentUser));
      showToast('✨ NFT faol qilindi! Profilingiz darhol o‘zgardi.', 'success');
      renderApp();
    };

    window.toggleNftAvatar = function() {
      const userId = AppState.currentUser.id;
      const user = DB.getUserById(userId) || AppState.currentUser;
      if (!getActiveNft(user)) { showToast('Avval Shopdan NFT oling!', 'error'); return; }
      DB.setActiveNft(userId, user.activeProductId, user.nftAvatarEnabled === false);
      AppState.currentUser = DB.getUserById(userId) || AppState.currentUser;
      sessionStorage.setItem('edutask_user', JSON.stringify(AppState.currentUser));
      renderApp();
    };

    window.contactTelegram = function() {
      window.open('https://t.me/Ahmadov_2012', '_blank', 'noopener,noreferrer');
    };

    window.openAddProductModal = function() {
      const mc = document.getElementById('modal-container');
      mc.innerHTML = `
        <div class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 fade-in">
          <div class="glass-card w-full max-w-md p-5 rounded-2xl border border-brand-border space-y-4 max-h-[92vh] overflow-y-auto">
            <div class="flex items-center justify-between gap-2">
              <h3 class="font-black text-white">🛒 Shopga yangi narsa qo'shish</h3>
              <button onclick="closeModal()" class="w-9 h-9 rounded-xl bg-slate-800 text-slate-300">×</button>
            </div>
            <form id="add-product-form" class="space-y-3">
              <input id="prd-name" type="text" required placeholder="Narsa nomi" class="w-full glass-input px-3 py-2.5 rounded-xl text-xs text-white">
              <textarea id="prd-desc" placeholder="Narsa haqida" class="w-full glass-input px-3 py-2.5 rounded-xl text-xs text-white"></textarea>
              <input id="prd-price" type="number" min="1" max="100000" required placeholder="Nechta ball?" class="w-full glass-input px-3 py-2.5 rounded-xl text-xs text-white">
              <label class="block text-xs font-bold text-slate-300">Mahsulot rasmi (ixtiyoriy)
                <input id="prd-image" type="file" accept="image/*" class="w-full mt-1 text-xs text-slate-400">
              </label>
              <div class="flex gap-2 pt-2">
                <button type="submit" class="flex-1 py-2.5 rounded-xl bg-brand-600 text-white text-xs font-black">Qo'shish</button>
                <button type="button" onclick="closeModal()" class="flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-bold">Bekor qilish</button>
              </div>
            </form>
          </div>
        </div>
      `;
      document.getElementById('add-product-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const file = document.getElementById('prd-image').files[0];
        const image = file ? await fileToDataURL(file) : '';
        const price = Number(document.getElementById('prd-price').value);
        if (!Number.isFinite(price) || price < 1) {
          showToast("Ball narxini to'g'ri kiriting!", "error");
          return;
        }
        DB.addProduct({
          id: 'prd-' + Date.now(),
          name: document.getElementById('prd-name').value.trim(),
          description: document.getElementById('prd-desc').value.trim(),
          price,
          image
        });
        closeModal();
        showToast("Shopga yangi narsa qo'shildi!");
        renderApp();
      });
    };

    window.deleteProduct = function(id) {
      if (!confirm("Bu mahsulotni shopdan olib tashlaysizmi?")) return;
      DB.deleteProduct(id);
      showToast("Mahsulot o'chirildi!");
      renderApp();
    };
